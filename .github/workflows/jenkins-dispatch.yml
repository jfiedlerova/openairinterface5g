name: Duranta Jenkins Dispatch

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [ci-duranta-fixes]
  push:
    branches:
      - ci-duranta-fixes

concurrency:
  group: ${{ github.event_name }}-${{ github.event.action }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-signed-commits:
    runs-on: ubuntu-24.04

    if: github.event_name == 'pull_request_target'

    steps:
      - name: Check all commits are signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UNSIGNED=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits \
            --paginate --jq '[.[] | select(.commit.verification.verified == false) | .sha[:7]] | join(", ")')

          if [ -n "$UNSIGNED" ]; then
            message="The following commit(s) are missing signature:\n\n$UNSIGNED\n\n"
            message+="Please use 'git commit -S' to sign your commits.\n"
            message+="For detailed instructions, refer to the [CONTRIBUTING](https://github.com/duranta-project/openairinterface5g?tab=contributing-ov-file) file at the root of this repository or [GitHub Docs](https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification)"
            echo -e "$message"
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$(cat <<EOF
          The following commit(s) are missing signature:

          $UNSIGNED

          Please use 'git commit -S' to sign your commits.
          For detailed instructions, refer to the [CONTRIBUTING](https://github.com/duranta-project/openairinterface5g?tab=contributing-ov-file) file at the root of this repository or [GitHub Docs](https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification)
          EOF
          )"
            exit 1
          fi

  check-labels:
    needs: verify-signed-commits
    runs-on: ubuntu-24.04

    if: github.event_name == 'pull_request_target'

    steps:
      - name: Check for mandatory CI label
        run: |
          PR_LABELS=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r '.[].name')

          for label in \
            "BUILD-ONLY" \
            "documentation" \
            "5G-NR" \
            "nrUE"; do
            if echo "$PR_LABELS" | grep -qxF "$label"; then
              exit 0
            fi
          done

          exit 1

  detect-changes:
    needs: check-labels
    runs-on: ubuntu-24.04

    if: |
      always() && (
        github.event_name == 'push' ||
        needs.check-labels.result == 'success'
      ) && (
        github.event.action != 'labeled' ||
        github.event.label.name == vars.RETRIGGER_CI_LABEL
      )

    outputs:
      protected_files_changed: ${{ steps.filter.outputs.protected }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            protected:
              - 'ci-scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'docker/**'
              - 'charts/**'
              - 'openshift/**'
              - 'cmake_targets/build_oai'
              - 'cmake_targets/tools/build_helper'

  require-maintainer-approval:
    needs: detect-changes

    if: needs.detect-changes.outputs.protected_files_changed == 'true'

    runs-on: ubuntu-24.04

    steps:
      - run: echo "Changes to be approved"

  trigger-jenkins:
    needs:
      - check-labels
      - detect-changes
      - require-maintainer-approval

    if: |
      always() &&
      (
        needs.detect-changes.outputs.protected_files_changed == 'false' ||
        needs.require-maintainer-approval.result == 'success'
      )

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Trigger Jenkins
        run: |
          # Write payload to a temp file to avoid shell escaping issues
          cat << 'EOF' > /tmp/payload.json
          ${{ toJson(github.event) }}
          EOF

          # Filter and send
          jq -c 'del(.pull_request.body)' /tmp/payload.json > /tmp/filtered_payload.json

          # Remap pull_request_target -> pull_request for Jenkins compatibility
          EVENT_NAME="${{ github.event_name }}"
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            EVENT_NAME="pull_request"
          fi
          echo '${{ toJson(github.event) }}'

      - name: Remove retrigger-ci label
        if: always() && github.event.action == 'labeled' && github.event.label.name == vars.RETRIGGER_CI_LABEL
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label "${{ vars.RETRIGGER_CI_LABEL }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
